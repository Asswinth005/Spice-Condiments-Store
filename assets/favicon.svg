<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAA135" />
      <stop offset="100%" stop-color="#B84A2E" />
    </linearGradient>

    <!-- Warm Highlight Gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Mortar Shading -->
    <linearGradient id="mortarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDE8D0" />
    </linearGradient>

    <!-- Spice Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#82A75C" />
      <stop offset="100%" stop-color="#4E6D28" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#FFE2B8" stroke-width="1.5" />
  
  <!-- Subtle Top Highlight -->
  <rect x="3" y="3" width="58" height="28" rx="14" fill="url(#highlightGrad)" />

  <!-- Aromatic Spice Leaves Top-Right -->
  <path d="M42 22 C42 13, 53 10, 54 10 C54 10, 53 21, 44 23 Z" fill="url(#leafGrad)" />
  <path d="M42 22 Q48 16 54 10" stroke="#A7C984" stroke-width="1" stroke-linecap="round" fill="none" />
  
  <path d="M37 17 C39 10, 47 9, 47 9 C47 9, 45 18, 38 18 Z" fill="#6B8E23" opacity="0.9" />

  <!-- Mortar Bowl Outer Base -->
  <path d="M14 36 Q14 52 32 52 Q50 52 50 36 L47 36 Q47 48 32 48 Q17 48 17 36 Z" fill="url(#mortarGrad)" />

  <!-- Mortar Bowl Rim Oval -->
  <ellipse cx="32" cy="36" rx="17.5" ry="5.5" fill="url(#mortarGrad)" />
  <ellipse cx="32" cy="36" rx="14" ry="3.8" fill="#8C351B" opacity="0.35" />

  <!-- Pestle Handle Angle -->
  <path d="M30 14 C28.5 14, 27 15.5, 28 18 L32 37 C32.5 39, 35.5 39, 36 37 L35 17 C35.5 15, 34 14, 32 14 Z" fill="#FFFDF8" />
  <circle cx="31.5" cy="15.5" r="3.2" fill="#FFFFFF" />

  <!-- Golden Spice Powder Glow inside bowl -->
  <ellipse cx="32.5" cy="36.5" rx="10" ry="2.5" fill="#F7CA45" opacity="0.9" />

  <!-- Aromatic Star Sparkles / Spice Seeds -->
  <circle cx="15" cy="22" r="1.5" fill="#FFEAA7" opacity="0.8" />
  <circle cx="21" cy="16" r="1.2" fill="#FFEAA7" opacity="0.7" />
  <circle cx="48" cy="28" r="1.4" fill="#FFEAA7" opacity="0.75" />
</svg>
